services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: simpeg_web

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: simpeg
      DB_USERNAME: simpeg
      DB_PASSWORD: secret


  db:
    image: mysql:8.0

    container_name: simpeg_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: simpeg
      MYSQL_USER: simpeg
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin:latest

    container_name: simpeg_phpmyadmin

    restart: unless-stopped

    ports:
      - "8081:80"

    environment:
      PMA_HOST: db

    depends_on:
      - db


volumes:
  mysql_data: